<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/create-post.js" defer></script>
    <title>Create Post - Blog</title>
    <link rel="stylesheet" href="../css/create-post.css">
</head>
<body class="create-post-page">

    <main class="create-post-main">
        <a href="index.html">
            <i class="fa-solid fa-arrow-left"></i>Back to Dashboard
        </a>

        <header class="create-post-header">
            <h1>Create a New Post</h1>
            <p>Write and publish a new article to your blog.</p>
        </header>

        <form id="createPostForm" class="post-form">

            <div class="form-group">
                <label for="title">Post Title</label>
                <input type="text" id="title" placeholder="Enter your post title" required>
            </div>

            <div class="form-group">
                <label for="image">Featured Image URL</label>
                <input type="url" id="image" placeholder="https://example.com/image.png" required>
            </div>

            <div class="form-group">
                <label for="content">Article Content</label>
                <textarea id="content" rows="12" placeholder="Start writting your article..." required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="publish-button">
                    <i class="fa-solid fa-paper-plane"></i>
                    Publish Post
                </button>
            </div>

        </form>
    </main>

</body>
</html>
