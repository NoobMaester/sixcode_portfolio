<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/create-post.css">

    <script src="../js/edit-post.js" defer></script>
    <title>Edit Post - Blog</title>
</head>
<body class="create-post-page">

    <main class="create-post-main">

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </a>

        <header class="create-post-header">
            <h1>Edit Post</h1>
            <p>Make changes to your existing article.</p>
        </header>

        <form id="editPostForm" class="post-form">

            <div class="form-group">
                <label for="title">Post Title</label>
                <input type="text" id="title" required>
            </div>

            <div class="form-group">
                <label for="image">Featured Image URL</label>
                <input type="url" id="image" required>
            </div>

            <div class="form-group">
                <label for="content">Article Content</label>
                <textarea id="content" rows="12" required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="publish-button">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Changes
                </button>
            </div>

        </form>
    </main>

</body>
</html>
